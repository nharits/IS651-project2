version: '3.8'
services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    volumes:
      - ./metabase-data:/metabase-data
      - ./garmin_clone.db:/metabase-data/garmin_clone.db
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    restart: unless-stopped
